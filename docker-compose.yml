version: '3.8'
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  nova:
    build: .
    container_name: nova
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./config.json:/app/config.json
      - ./profiles:/app/profiles
      - ./tools:/app/tools
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - BACKEND=ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: always

volumes:
  ollama_data:
