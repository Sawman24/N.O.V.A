version: '3.8'
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 5

  nova:
    build: .
    container_name: nova
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      - nova_profiles:/app/profiles
      - nova_tools:/app/tools
      - nova_models:/app/models
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - BACKEND=${BACKEND:-ollama}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MODEL_FILE=${HF_MODEL_FILE:-}
      - N_GPU_LAYERS=${N_GPU_LAYERS:-0}
      - N_CTX=${N_CTX:-4096}
    depends_on:
      ollama:
        condition: service_healthy
    restart: always

volumes:
  ollama_data:
  nova_profiles:
  nova_tools:
  nova_models:
